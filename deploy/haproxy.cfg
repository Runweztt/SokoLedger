# Alternative to nginx.conf — use this when you want real ACTIVE health
# checks against /healthz (haproxy probes each backend independently of
# live traffic, unlike stock nginx's passive-only checking). Replace the
# two server IPs with web-01/web-02's private addresses.

global
    log /dev/log local0
    maxconn 2000
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  45s
    timeout server  45s

frontend sokoledger_front
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/jargsai.tech.pem
    http-request redirect scheme https unless { ssl_fc }
    default_backend sokoledger_back

backend sokoledger_back
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server web01 10.0.0.11:3000 check inter 5s fall 3 rise 2
    server web02 10.0.0.12:3000 check inter 5s fall 3 rise 2
