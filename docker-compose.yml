services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sokoledger
      POSTGRES_PASSWORD: sokoledger
      POSTGRES_DB: sokoledger
    ports:
      # Local-dev only, not used in production (production runs on Supabase,
      # see README "Data tier" section).
      - "127.0.0.1:5432:5432"
    volumes:
      - sokoledger_pgdata:/var/lib/postgresql/data

volumes:
  sokoledger_pgdata:
