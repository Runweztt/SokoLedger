# lb-01 — round-robin between web-01 and web-02.
#
# Replace the two `server` IPs with web-01/web-02's private addresses.
#
# Honest limitation: stock nginx (OSS) only does PASSIVE health checking
# — max_fails/fail_timeout mark a backend down only after real requests
# to it fail, there is no active out-of-band probe of /healthz. Active
# health checks (`proxy_pass` skipping a backend before it's ever sent
# live traffic) require nginx Plus. If you need real active checks with
# stock software, use deploy/haproxy.cfg instead — see README.

upstream sokoledger_backend {
  server 10.0.0.11:3000 max_fails=3 fail_timeout=10s;  # web-01
  server 10.0.0.12:3000 max_fails=3 fail_timeout=10s;  # web-02
  # No load-balancing directive = round robin, nginx's default.
}

server {
  listen 80;
  server_name _;

  location / {
    proxy_pass http://sokoledger_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
  }
}
